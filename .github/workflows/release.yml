name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never interpolated into a script:
      # a tag name is untrusted input.
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "release tags look like v1.2.3 or v1.2.3-rc.1, got: $VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: make dist VERSION="$VERSION"
      - run: gh release create "$VERSION" --verify-tag --generate-notes "dist/$VERSION"/*.tar.gz "dist/$VERSION"/*.deb "dist/$VERSION"/*.rpm "dist/$VERSION"/*.pkg.tar.zst "dist/$VERSION/SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The build stage cross-compiles on the runner's own platform and the
      # final stage runs nothing, so arm64 needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
